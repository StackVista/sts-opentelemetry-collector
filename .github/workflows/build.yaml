name: Restore previous Collector registry alias
on:
  push:
    branches: [recover/test-tag-latest]
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Restore the previously signed latest binding
        env:
          REPOSITORY: quay.io/stackstate/sts-opentelemetry-collector
          PREVIOUS: sha256:8fe9d6ee14e2e0539cf5fb916a992bc6c036888dd6a6212325fdcfab39f1ab15
          CANDIDATE: sha256:080e4caf41dbedc7546fd2b32b290b62e51cbbdd3ad243c49b56975da7be04db
        run: |
          set -euo pipefail
          current=$(docker buildx imagetools inspect "${REPOSITORY}:latest" --format '{{.Manifest.Digest}}')
          if [ "$current" = "$PREVIOUS" ]; then
            echo 'Previous binding is already restored.'
            exit 0
          fi
          if [ "$current" != "$CANDIDATE" ]; then
            echo 'Latest changed independently; refusing to overwrite it.' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${REPOSITORY}:latest" "${REPOSITORY}@${PREVIOUS}"
          restored=$(docker buildx imagetools inspect "${REPOSITORY}:latest" --format '{{.Manifest.Digest}}')
          test "$restored" = "$PREVIOUS"
          echo "Restored latest to ${restored}" >> "$GITHUB_STEP_SUMMARY"
