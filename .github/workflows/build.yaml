name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
      - 'test-*'

env:
  REGISTRY: quay.io
  IMAGE_NAME: stackstate/sts-opentelemetry-collector
  GO_VERSION: 1.26.6
  GOLANGCI_LINT_VERSION: v2.12.2

# Default to read-only at the workflow level. Jobs that need more
# (publish: packages:write; scan: security-events:write for SARIF upload)
# opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.image }} ${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [server, agent]
        arch: [linux-amd64, linux-arm64]
        include:
          - arch: linux-amd64
            platform: linux/amd64
          - arch: linux-arm64
            platform: linux/arm64
          - image: server
            dockerfile: Dockerfile
            title: SUSE Observability OpenTelemetry Collector
            description: Custom OpenTelemetry Collector for SUSE Observability
          - image: agent
            dockerfile: Dockerfile.agent
            title: SUSE Observability OpenTelemetry Agent Collector
            description: Strict agent OpenTelemetry Collector for SUSE Observability
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta (labels only)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.image == 'agent' && '-agent' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{github.repository_owner}}/${{ github.repository }}

      - name: Resolve image short name
        id: image-name
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
        run: echo "value=${IMAGE##*/}" >> "$GITHUB_OUTPUT"

      - name: Apply OCI labels
        id: oci-labels
        uses: StackVista/image-pipeline/.github/actions/apply-oci-labels@6284a6fc006a7cc46a7f00d02c50d5f21b117b63
        with:
          image-name: ${{ steps.image-name.outputs.value }}
          tag: ${{ steps.meta.outputs.version }}
          title: ${{ matrix.title }}
          description: ${{ matrix.description }}
          component: otel-collector
          dockerfile: ${{ matrix.dockerfile }}

      - name: Install protoc # TODO create a docker image with protoc installed
        run: |
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.8

      - name: Generate shared-protobuf-protocols read token
        id: protobuf-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.READ_PROTOBUF_PROTOCOLS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.READ_PROTOBUF_PROTOCOLS_GH_APP_PRIVATE_KEY }}
          repositories: shared-protobuf-protocols
          permission-contents: read

      - name: Generate go model
        env:
          GITHUB_SHARED_PROTOBUF_TOKEN: ${{ steps.protobuf-token.outputs.token }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          ./connector/topologyconnector/scripts/generate_protobuf_model.sh
          ./extension/settingsproviderextension/scripts/generate_openapi_model.sh
          ./scripts/check_no_changes.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Build ${{ matrix.platform }} to local docker tarball
        # Per-arch single-platform build, output as a docker-format tarball
        # (not pushed). The tarball is uploaded as an artifact so scan, e2e,
        # and publish can each `docker load` it without the registry seeing
        # bytes that have not yet passed scan.
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/image.tar
          tags: sts-opentelemetry-collector:build
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.oci-labels.outputs.labels }}
          provenance: false
          sbom: false

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/image.tar
          retention-days: 1

  openpgp-guard:
    name: Assert no OpenPGP linkage (GO-2026-5932 VEX)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download every image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: /tmp/artifacts

      - name: Extract the entrypoint binary from each artifact
        run: |
          set -euo pipefail

          mkdir -p /tmp/bins
          shopt -s nullglob
          artifacts=(/tmp/artifacts/image-*/image.tar)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "no image artifacts found, so the guard would pass without inspecting anything" >&2
            exit 1
          fi

          for tarball in "${artifacts[@]}"; do
            artifact=$(basename "$(dirname "$tarball")")
            loaded=$(docker load -i "$tarball" | awk -F': ' '/^Loaded image/ {print $NF}')
            platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$loaded")
            entrypoint=$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$loaded")
            case "$entrypoint" in
              /*) ;;
              *)
                echo "${artifact}: entrypoint '${entrypoint}' is not an absolute path" >&2
                exit 1
                ;;
            esac
            container=$(docker create --platform "$platform" "$loaded")
            docker cp "${container}:${entrypoint}" "/tmp/bins/${artifact}"
            docker rm -f "$container" > /dev/null
            echo "${artifact}: ${platform} ${entrypoint}"
          done

      - name: Assert the VEX assumption still holds
        run: ./scripts/check_no_openpgp.sh /tmp/bins/*

  publish:
    name: Scan, sign, and publish (${{ matrix.image }})
    needs: [build, openpgp-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signing
      security-events: write   # SARIF upload from scan-image
    strategy:
      fail-fast: false
      matrix:
        image: [server, agent]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta (release tags)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.image == 'agent' && '-agent' || '' }}

      - name: Download image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-${{ matrix.image }}-*
          path: /tmp/artifacts

      # scan-sign-push expects <tarball-dir>/image-<arch>.tar (arch = amd64|arm64).
      # The build job emits image-<variant>-<arch>/image.tar (arch = linux-<arch>),
      # so stage them under the expected names for this variant.
      - name: Stage per-arch tarballs
        run: |
          set -euo pipefail
          mkdir -p /tmp/sts-images
          cp "/tmp/artifacts/image-${{ matrix.image }}-linux-amd64/image.tar" /tmp/sts-images/image-amd64.tar
          cp "/tmp/artifacts/image-${{ matrix.image }}-linux-arm64/image.tar" /tmp/sts-images/image-arm64.tar

      # Publish (push + sign) only on release-tag refs; on branches/PRs the action
      # runs the scan gate only (secrets fail-closed) so a bad image is caught
      # before merge, without pushing or signing.
      - name: Decide whether to publish
        id: gate
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan (and, on tags, sign and push)
        uses: StackVista/image-pipeline/.github/actions/scan-sign-push@966825ab47758bf0b5e6db1824086548141362b1
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          arches: amd64,arm64
          source-mode: tarball
          tarball-dir: /tmp/sts-images
          publish: ${{ steps.gate.outputs.publish }}
          sarif-category-prefix: sts-opentelemetry-collector-${{ matrix.image }}
          target-registry: ${{ env.REGISTRY }}
          target-registry-user: ${{ secrets.QUAY_USER }}
          target-registry-password: ${{ secrets.QUAY_PASSWORD }}
          fail-on-existing-tags: 'false'

  detect-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: set-modules
        run: echo "modules=$(go list -m -json | jq -s '.' | jq -c '[.[].Dir]')" >> "$GITHUB_OUTPUT"

  lint:
    needs: detect-modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: golangci-lint ${{ matrix.modules }}
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.modules }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      clickhouse:
        image: clickhouse/clickhouse-server@sha256:6d8f358747b59f7db044749eaf951e828e75cc16f9c487f855b114272c44b82c # latest as of 2026-05-15
        ports:
          - "9000:9000"
          - "8123:8123"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run tests
        run: |
          set -euo pipefail

          plugin_paths=$(git ls-files \
            'connector/*/go.mod' \
            'exporter/*/go.mod' \
            'extension/*/go.mod' \
            'processor/*/go.mod' \
            'receiver/*/go.mod' |
            awk -F/ 'NF == 3 { sub("/go.mod$", ""); print "./" $0 }' |
            sort -u)

          if [ -z "$plugin_paths" ]; then
            echo "No local plugin modules found" >&2
            exit 1
          fi

          for plugin_path in $plugin_paths; do
            echo "::group::go test ${plugin_path}/..."
            go test "${plugin_path}/..."
            echo "::endgroup::"
          done

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Docker
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Run integration tests
        run: |
          (cd exporter/stskafkaexporter/integration && GOWORK=off go test -tags=integration ./...)
          (cd extension/settingsproviderextension/integration && GOWORK=off go test -tags=integration ./...)

  e2e-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Docker
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Download amd64 image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-server-linux-amd64
          path: /tmp

      - name: Load image into local docker daemon
        run: |
          set -euo pipefail
          loaded=$(docker load -i /tmp/image.tar | awk -F': ' '/Loaded image/ {print $NF}')
          docker tag "$loaded" sts-opentelemetry-collector:e2e

      - name: Run E2E tests
        env:
          OTEL_COLLECTOR_IMAGE: sts-opentelemetry-collector:e2e
        run: go test -v ./test/e2e/...

  validate:
    name: Validate agent configs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download agent amd64 image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-agent-linux-amd64
          path: /tmp

      - name: Load image into local docker daemon
        run: |
          set -euo pipefail
          loaded=$(docker load -i /tmp/image.tar | awk -F': ' '/Loaded image/ {print $NF}')
          echo "Loaded $loaded"
          docker tag "$loaded" sts-otel-agent:validate

      - name: Validate agent config fixtures
        run: |
          set -euo pipefail
          for cfg in scraper.yaml k8s-resource.yaml telemetry-gateway.yaml; do
            echo "::group::validate ${cfg}"
            docker run --rm -v "$PWD/test/validate/configs:/cfg" \
              sts-otel-agent:validate validate --config "/cfg/${cfg}"
            echo "::endgroup::"
          done
