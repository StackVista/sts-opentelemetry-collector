name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'test-*'

env:
  REGISTRY: quay.io
  IMAGE_NAME: stackstate/sts-opentelemetry-collector
  GO_VERSION: 1.26.10
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.12.2

# Default to read-only at the workflow level. Jobs that need more
# (publish: packages:write; scan: security-events:write for SARIF upload)
# opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow security lint (Zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Audit workflows, composite actions, and Dependabot
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          inputs: .
          collect: workflows,actions,dependabot

      - name: Check generated-file boundary
        run: python3 -B -m unittest discover -s scripts -p 'test_renovate_codegen.py'

  build:
    name: Build (${{ matrix.image }} ${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [server, agent]
        arch: [linux-amd64, linux-arm64]
        include:
          - arch: linux-amd64
            platform: linux/amd64
          - arch: linux-arm64
            platform: linux/arm64
          - image: server
            dockerfile: Dockerfile
            title: SUSE Observability OpenTelemetry Collector
            description: Custom OpenTelemetry Collector for SUSE Observability
          - image: agent
            dockerfile: Dockerfile.agent
            title: SUSE Observability OpenTelemetry Agent Collector
            description: Strict agent OpenTelemetry Collector for SUSE Observability
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta (labels only)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && 'auto' || 'false' }}
            suffix=${{ matrix.image == 'agent' && '-agent' || '' }},onlatest=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{github.repository_owner}}/${{ github.repository }}

      - name: Resolve image short name
        id: image-name
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
        run: echo "value=${IMAGE##*/}" >> "$GITHUB_OUTPUT"

      - name: Apply OCI labels
        id: oci-labels
        uses: StackVista/image-pipeline/.github/actions/apply-oci-labels@6284a6fc006a7cc46a7f00d02c50d5f21b117b63
        with:
          image-name: ${{ steps.image-name.outputs.value }}
          tag: ${{ steps.meta.outputs.version }}
          title: ${{ matrix.title }}
          description: ${{ matrix.description }}
          component: otel-collector
          dockerfile: ${{ matrix.dockerfile }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install protoc # TODO create a docker image with protoc installed
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.8

      - name: Generate shared-protobuf-protocols read token
        id: protobuf-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.READ_PROTOBUF_PROTOCOLS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.READ_PROTOBUF_PROTOCOLS_GH_APP_PRIVATE_KEY }}
          repositories: shared-protobuf-protocols
          permission-contents: read

      - name: Generate go model
        env:
          GITHUB_SHARED_PROTOBUF_TOKEN: ${{ steps.protobuf-token.outputs.token }}
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          ./connector/topologyconnector/scripts/generate_protobuf_model.sh
          ./extension/settingsproviderextension/scripts/generate_openapi_model.sh
          ./scripts/check_no_changes.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build ${{ matrix.platform }} to local docker tarball
        # Per-arch single-platform build, output as a docker-format tarball
        # (not pushed). The tarball is uploaded as an artifact so scan, e2e,
        # and publish can each `docker load` it without the registry seeing
        # bytes that have not yet passed scan.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/image.tar
          tags: sts-opentelemetry-collector:build
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.oci-labels.outputs.labels }}
          provenance: false
          sbom: false

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/image.tar
          retention-days: 1

  publish:
    name: Scan, sign, and publish (${{ matrix.image }})
    needs: [zizmor, build, lint, test, integration-test, schema-compatibility, e2e-test, logs-process-faults, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signing
      security-events: write   # SARIF upload from scan-image
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: [server, agent]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta (release tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && 'auto' || 'false' }}
            suffix=${{ matrix.image == 'agent' && '-agent' || '' }},onlatest=true

      - name: Download image artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ matrix.image }}-*
          path: /tmp/artifacts

      # scan-sign-push expects <tarball-dir>/image-<arch>.tar (arch = amd64|arm64).
      # The build job emits image-<variant>-<arch>/image.tar (arch = linux-<arch>),
      # so stage them under the expected names for this variant.
      - name: Stage per-arch tarballs
        run: |
          set -euo pipefail
          mkdir -p /tmp/sts-images
          cp "/tmp/artifacts/image-${{ matrix.image }}-linux-amd64/image.tar" /tmp/sts-images/image-amd64.tar
          cp "/tmp/artifacts/image-${{ matrix.image }}-linux-arm64/image.tar" /tmp/sts-images/image-arm64.tar

      - name: Load per-arch images for CVE reporting
        env:
          GATE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GATE_TAG: cve-gate-${{ matrix.image }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            loaded=$(docker load -i "/tmp/sts-images/image-${arch}.tar" | awk -F': ' '/Loaded image/ {print $NF}')
            target="${GATE_REPO}:${GATE_TAG}-${arch}"
            docker tag "$loaded" "$target"
            # Keep the published repository identity so OpenVEX product PURLs match.
            if [ "$loaded" != "$target" ]; then
              docker rmi "$loaded" > /dev/null
            fi
          done

      - name: CVE report and secret scan (amd64)
        uses: StackVista/image-pipeline/.github/actions/scan-image@d847894223a794b4f4834654af20a04278b16b4f # main
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cve-gate-${{ matrix.image }}-amd64
          mode: inform
          severity: HIGH,CRITICAL
          upload-sarif: 'false'

      - name: CVE report and secret scan (arm64)
        uses: StackVista/image-pipeline/.github/actions/scan-image@d847894223a794b4f4834654af20a04278b16b4f # main
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cve-gate-${{ matrix.image }}-arm64
          mode: inform
          severity: HIGH,CRITICAL
          upload-sarif: 'false'

      # Publish (push + sign) only on release-tag refs; on branches/PRs the action
      # runs its scan steps only (secrets fail-closed) so a bad image is caught
      # before merge, without pushing or signing.
      - name: Decide whether to publish
        id: gate
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan (and, on tags, sign and push)
        uses: StackVista/image-pipeline/.github/actions/scan-sign-push@d847894223a794b4f4834654af20a04278b16b4f # main
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          arches: amd64,arm64
          source-mode: tarball
          tarball-dir: /tmp/sts-images
          publish: ${{ steps.gate.outputs.publish }}
          sarif-category-prefix: sts-opentelemetry-collector-${{ matrix.image }}
          target-registry: ${{ env.REGISTRY }}
          target-registry-user: ${{ secrets.QUAY_USER }}
          target-registry-password: ${{ secrets.QUAY_PASSWORD }}
          fail-on-existing-tags: 'false'

  detect-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.set-modules.outputs.modules }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: set-modules
        run: echo "modules=$(go list -m -json | jq -s '.' | jq -c '[.[].Dir]')" >> "$GITHUB_OUTPUT"

  lint:
    needs: detect-modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: golangci-lint ${{ matrix.modules }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.modules }}

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      clickhouse:
        image: registry.tooling.stackstate.io/quay/stackstate/clickhouse:26.8.34.13-so2
        credentials:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "yes"
        ports:
          - "9000:9000"
          - "8123:8123"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run tests
        run: |
          set -euo pipefail

          plugin_paths=$(git ls-files \
            'connector/*/go.mod' \
            'exporter/*/go.mod' \
            'extension/*/go.mod' \
            'processor/*/go.mod' \
            'receiver/*/go.mod' |
            awk -F/ 'NF == 3 { sub("/go.mod$", ""); print "./" $0 }' |
            sort -u)

          if [ -z "$plugin_paths" ]; then
            echo "No local plugin modules found" >&2
            exit 1
          fi

          go test -race ./common/...
          for plugin_path in $plugin_paths; do
            echo "::group::go test ${plugin_path}/..."
            go test "${plugin_path}/..."
            echo "::endgroup::"
          done

  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Run integration tests
        run: |
          (cd exporter/stskafkaexporter/integration && GOWORK=off go test -tags=integration ./...)
          (cd exporter/clickhousestsexporter/integration && GOWORK=off go test -tags=integration ./...)
          (cd extension/settingsproviderextension/integration && GOWORK=off go test -tags=integration ./...)

  schema-compatibility:
    name: StackState schema compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # secrets.GITHUB_TOKEN cannot read another repo's contents; needs its own narrowly-scoped App,
      # same shape as the protobuf-token step above (repositories: stackstate, permission-contents: read).
      - name: Generate stackstate schema read token
        id: stackstate-schema-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.STACKSTATE_REPO_READ_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.STACKSTATE_REPO_READ_GH_APP_PRIVATE_KEY }}
          repositories: stackstate
          permission-contents: read
      - name: Run against StackState's real, pinned schema
        env:
          GH_TOKEN: ${{ steps.stackstate-schema-token.outputs.token }}
          # renovate: datasource=git-refs depName=https://github.com/StackVista/stackstate
          STACKSTATE_SCHEMA_REF_VERSION: be45a6d9767c276200cf6f27e41a737366a0ab7c
        run: |
          cd exporter/clickhousestsexporter/integration
          GOWORK=off go test -tags "integration schema_contract" -run TestLogsExporter_MatchesStackStateSchema -v ./...

  e2e-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Set up Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download amd64 image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-server-linux-amd64
          path: /tmp

      - name: Load image into local docker daemon
        run: |
          set -euo pipefail
          loaded=$(docker load -i /tmp/image.tar | awk -F': ' '/Loaded image/ {print $NF}')
          docker tag "$loaded" sts-opentelemetry-collector:e2e

      - name: Run E2E tests
        env:
          OTEL_COLLECTOR_IMAGE: sts-opentelemetry-collector:e2e
        run: go test -v ./test/e2e/...

  logs-process-faults:
    name: Logs process fault injection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build agent with test-only source overlays and race detection
        run: go run ./test/logsagent/cmd/faultagent -output /tmp/otel-agent-faults
      - name: Test admission, worker shutdown and signal failures
        env:
          OTEL_AGENT_FAULT_BINARY: /tmp/otel-agent-faults
        run: go test -race -count=1 -timeout=180s -run '^TestInjected' ./test/logsagent -require-fault-agent

  validate:
    name: Validate agent configs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download agent amd64 image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-agent-linux-amd64
          path: /tmp

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Load image into local docker daemon
        run: |
          set -euo pipefail
          loaded=$(docker load -i /tmp/image.tar | awk -F': ' '/Loaded image/ {print $NF}')
          echo "Loaded $loaded"
          docker tag "$loaded" sts-otel-agent:validate

      - name: Validate agent config fixtures
        run: |
          set -euo pipefail
          for cfg in scraper.yaml k8s-resource.yaml telemetry-gateway.yaml promtail-logs-exporter.yaml promtail-logs-agent.yaml logs-agent.yaml; do
            echo "::group::validate ${cfg}"
            docker run --rm -v "$PWD/test/validate/configs:/cfg" \
              sts-otel-agent:validate validate --config "/cfg/${cfg}"
            echo "::endgroup::"
          done

      - name: Test Filelog routing and process lifecycle
        run: |
          set -euo pipefail
          container=$(docker create sts-otel-agent:validate)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/sts-opentelemetry-agent-collector" /tmp/otel-agent
          chmod +x /tmp/otel-agent
          OTEL_AGENT_BINARY=/tmp/otel-agent go test -race -count=1 -timeout=180s ./test/logsagent/... -require-agent

  ci-success:
    name: ci-success
    if: always()
    needs: [zizmor, build, detect-modules, lint, test, integration-test, schema-compatibility, e2e-test, logs-process-faults, validate, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless every required job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
