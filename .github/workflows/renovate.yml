name: Renovate

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    uses: StackVista/renovate-config/.github/workflows/renovate.yml@10734b53596c7bf4649ece6cbb2284a9899aaea1 # renovate-repository-scope
    with:
      dependency_read_repositories: stackstate
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}

  branches:
    needs: renovate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
    steps:
      - id: branches
        name: Find open Renovate PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branches=$(gh api --paginate --slurp "repos/$REPOSITORY/pulls?state=open&per_page=100" |
            jq -c --arg repo "$REPOSITORY" --arg base "$DEFAULT_BRANCH" \
              '[.[][] | select(.user.login == "renovate-update-app[bot]" and
                .head.repo.full_name == $repo and .base.ref == $base and
                (.head.ref | startswith("renovate/"))) |
                {number, branch: .head.ref, sha: .head.sha}]')
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  generate:
    name: Generate models for PR ${{ matrix.pr.number }}
    needs: branches
    if: needs.branches.outputs.branches != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.branches.outputs.branches) }}
    steps:
      - name: Fetch public PR source without credentials
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ matrix.pr.sha }}
        run: |
          git init source
          git -C source remote add origin "https://github.com/$REPOSITORY.git"
          git -C source -c credential.helper= fetch --depth=1 origin "$HEAD_SHA"
          git -C source checkout --detach FETCH_HEAD
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.work
          cache: false
      - name: Generate OpenAPI models
        working-directory: source
        run: go -C extension/settingsproviderextension generate ./generated/settingsproto/... ./generated/settingsschema/...
      - name: Collect generated files
        run: |
          mkdir "$RUNNER_TEMP/generated"
          cp source/extension/settingsproviderextension/generated/settingsproto/model.gen.go "$RUNNER_TEMP/generated/settingsproto.go"
          cp source/extension/settingsproviderextension/generated/settingsschema/model.gen.go "$RUNNER_TEMP/generated/settingsschema.go"
          cp source/go.work.sum "$RUNNER_TEMP/generated/go.work.sum"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-${{ matrix.pr.number }}-${{ matrix.pr.sha }}
          path: ${{ runner.temp }}/generated/
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit models for PR ${{ matrix.pr.number }}
    needs: [branches, generate]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.branches.result == 'success' && needs.branches.outputs.branches != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.branches.outputs.branches) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-${{ matrix.pr.number }}-${{ matrix.pr.sha }}
          path: ${{ runner.temp }}/generated/
      - name: Validate generated files
        env:
          GENERATED_DIRECTORY: ${{ runner.temp }}/generated
        run: node scripts/commit_renovate_codegen.cjs --validate
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: read
      - name: Commit generated files if the PR head is unchanged
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ matrix.pr.number }}
          PR_BRANCH: ${{ matrix.pr.branch }}
          HEAD_SHA: ${{ matrix.pr.sha }}
          GENERATED_DIRECTORY: ${{ runner.temp }}/generated
        run: node scripts/commit_renovate_codegen.cjs
