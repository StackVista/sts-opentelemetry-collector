name: Renovate

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: StackVista/renovate-config/.github/workflows/renovate.yml@10734b53596c7bf4649ece6cbb2284a9899aaea1 # renovate-repository-scope
    with:
      dependency_read_repositories: stackstate
      allowed_commands: '["^go -C extension/settingsproviderextension generate \\./generated/settingsproto/\\.\\.\\. \\./generated/settingsschema/\\.\\.\\.$"]'
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
