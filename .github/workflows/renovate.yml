name: Renovate

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: StackVista/renovate-config/.github/workflows/renovate.yml@8f2cca0d58dd1173affe6deb6a09debe4305a7cf # renovate-docker-tasks
    with:
      mount_docker_socket: true
      allowed_commands: '["^bash scripts/renovate-codegen\\.sh$"]'
      docker_registry_2: registry.tooling.stackstate.io
      docker_registry_2_username: ${{ vars.REGISTRY_USER }}
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
      DOCKER_REGISTRY_2_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
