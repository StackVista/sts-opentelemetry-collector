name: Renovate

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    uses: StackVista/renovate-config/.github/workflows/renovate.yml@b45b5e8a8c734bb63b96709d363e15b7deabfec2 # renovate-docker-tasks
    with:
      mount_docker_socket: true
      allowed_commands: '["^python3 scripts/renovate_codegen\\.py$"]'
    secrets:
      RENOVATE_GH_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_GH_APP_PRIVATE_KEY }}
