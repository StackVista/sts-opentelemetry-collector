name: Renovate Auto-Approve

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate-auto-approve

jobs:
  approve:
    if: github.ref == 'refs/heads/main' && vars.RENOVATE_APPROVAL_GH_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Approve verified Renovate PRs
        uses: StackVista/renovate-config/.github/actions/auto-approve-renovate@10734b53596c7bf4649ece6cbb2284a9899aaea1 # renovate-repository-scope
        with:
          app-client-id: ${{ vars.RENOVATE_APPROVAL_GH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RENOVATE_APPROVAL_GH_APP_PRIVATE_KEY }}
