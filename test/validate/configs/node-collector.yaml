]volume[.]stats[.]capacity_bytes|kubernetes[.]kubelet[.]volume[.]stats[.]inodes|kubernetes[.]kubelet[.]volume[.]stats[.]inodes_free|kubernetes[.]kubelet[.]volume[.]stats[.]inodes_used|kubernetes[.]kubelet[.]volume[.]stats[.]used_bytes|kubernetes[.]liveness_probe[.]failure[.]total|kubernetes[.]liveness_probe[.]success[.]total|kubernetes[.]liveness_probe[.]unknown[.]total|kubernetes[.]memory[.]cache|kubernetes[.]memory[.]limits|kubernetes[.]memory[.]rss|kubernetes[.]memory[.]sw_limit|kubernetes[.]memory[.]swap|kubernetes[.]memory[.]usage|kubernetes[.]memory[.]usage_pct|kubernetes[.]memory[.]working_set|kubernetes[.]network[.]rx_bytes|kubernetes[.]network[.]rx_dropped|kubernetes[.]network[.]rx_errors|kubernetes[.]network[.]tx_bytes|kubernetes[.]network[.]tx_dropped|kubernetes[.]network[.]tx_errors|kubernetes[.]readiness_probe[.]failure[.]total|kubernetes[.]readiness_probe[.]success[.]total|kubernetes[.]readiness_probe[.]unknown[.]total|kubernetes[.]slis[.]kubernetes_healthcheck|kubernetes[.]slis[.]kubernetes_healthchecks_total|kubernetes[.]startup_probe[.]failure[.]total|kubernetes[.]startup_probe[.]success[.]total|kubernetes[.]startup_probe[.]unknown[.]total)$")'
  transform/self-metrics:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["k8s.cluster.name"], "validate-cluster")
          - set(attributes["service.name"], "suse-observability-agent-node-collector")
          - set(attributes["service.instance.id"], attributes["k8s.pod.uid"]) where attributes["service.instance.id"] == nil and attributes["k8s.pod.uid"] != nil
  batch: {}

exporters:
  debug:
    verbosity: basic
  otlphttp/suse-observability:
    auth:
      authenticator: bearertokenauth
    endpoint: http://127.0.0.1:7077
    tls:
      insecure_skip_verify: false
    compression: gzip
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 127.0.0.1:1777
  bearertokenauth:
    scheme: SUSEObservability
    token: validate-token

service:
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, pprof, bearertokenauth]
  pipelines:
    metrics/native:
      receivers: [kubeletstats, prometheus/cadvisor, prometheus/kubelet, prometheus/probes, prometheus/slis, hostmetrics]
      processors: [memory_limiter, k8sattributes, transform/node-identity, cumulativetodelta, deltatorate, transform/resource-compat, transform/agent-v2-labels, filter/contract, batch]
      exporters: [otlphttp/suse-observability]
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, k8sattributes, transform/self-metrics, batch]
      exporters: [otlphttp/suse-observability]
