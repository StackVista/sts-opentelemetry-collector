receivers:
  kubeletstats:
    collection_interval: 20s
    initial_delay: 5s
    auth_type: serviceAccount
    endpoint: https://${env:KUBE_NODE_IP}:10250
    insecure_skip_verify: true
    metric_groups:
      - container
      - pod
      - node
      - volume

  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: kubelet-cadvisor
          scrape_interval: 30s
          scheme: https
          metrics_path: /metrics/cadvisor
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            insecure_skip_verify: true
          static_configs:
            - targets:
                - ${env:KUBE_NODE_IP}:10250

  prometheus/kubelet:
    config:
      scrape_configs:
        - job_name: kubelet
          scrape_interval: 30s
          scheme: https
          metrics_path: /metrics
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            insecure_skip_verify: true
          static_configs:
            - targets:
                - ${env:KUBE_NODE_IP}:10250
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: kubelet_container_log_filesystem_used_bytes
              target_label: __name__
              replacement: kubernetes.kubelet.container.log_filesystem.used_bytes
            - source_labels: [__name__]
              regex: kubelet_cpu_manager_pinning_errors_total
              target_label: __name__
              replacement: kubernetes.kubelet.cpu_manager.pinning_errors_total
            - source_labels: [__name__]
              regex: kubelet_cpu_manager_pinning_requests_total
              target_label: __name__
              replacement: kubernetes.kubelet.cpu_manager.pinning_requests_total
            - source_labels: [__name__]
              regex: kubelet_evictions
              target_label: __name__
              replacement: kubernetes.kubelet.evictions
            - source_labels: [__name__]
              regex: kubelet_network_plugin_operations_duration_seconds_count
              target_label: __name__
              replacement: kubernetes.kubelet.network_plugin.latency.count
            - source_labels: [__name__]
              regex: kubelet_pleg_discard_events
              target_label: __name__
              replacement: kubernetes.kubelet.pleg.discard_events
            - source_labels: [__name__]
              regex: kubelet_pleg_last_seen_seconds
              target_label: __name__
              replacement: kubernetes.kubelet.pleg.last_seen
            - source_labels: [__name__]
              regex: kubelet_pod_start_duration_seconds_count
              target_label: __name__
              replacement: kubernetes.kubelet.pod.start.duration.count
            - source_labels: [__name__]
              regex: kubelet_pod_worker_duration_seconds_count
              target_label: __name__
              replacement: kubernetes.kubelet.pod.worker.duration.count
            - source_labels: [__name__]
              regex: kubelet_pod_worker_start_duration_seconds_count
              target_label: __name__
              replacement: kubernetes.kubelet.pod.worker.start.duration.count
            - source_labels: [__name__]
              regex: kubelet_runtime_operations_total
              target_label: __name__
              replacement: kubernetes.kubelet.runtime.operations
            - source_labels: [__name__]
              regex: kubelet_runtime_operations_errors_total
              target_label: __name__
              replacement: kubernetes.kubelet.runtime.errors
            - source_labels: [__name__]
              regex: kubelet_runtime_operations_duration_seconds_count
              target_label: __name__
              replacement: kubernetes.kubelet.runtime.operations.duration.count
            - source_labels: [__name__]
              regex: kubelet_volume_stats_available_bytes
              target_label: __name__
              replacement: kubernetes.kubelet.volume.stats.available_bytes
            - source_labels: [__name__]
              regex: kubelet_volume_stats_capacity_bytes
              target_label: __name__
              replacement: kubernetes.kubelet.volume.stats.capacity_bytes
            - source_labels: [__name__]
              regex: kubelet_volume_stats_inodes
              target_label: __name__
              replacement: kubernetes.kubelet.volume.stats.inodes
            - source_labels: [__name__]
              regex: kubelet_volume_stats_inodes_free
              target_label: __name__
              replacement: kubernetes.kubelet.volume.stats.inodes_free
            - source_labels: [__name__]
              regex: kubelet_volume_stats_inodes_used
              target_label: __name__
              replacement: kubernetes.kubelet.volume.stats.inodes_used
            - source_labels: [__name__]
              regex: kubelet_volume_stats_used_bytes
              target_label: __name__
              replacement: kubernetes.kubelet.volume.stats.used_bytes

  prometheus/probes:
    config:
      scrape_configs:
        - job_name: kubelet-probes
          scrape_interval: 30s
          scheme: https
          metrics_path: /metrics/probes
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            insecure_skip_verify: true
          static_configs:
            - targets:
                - ${env:KUBE_NODE_IP}:10250
          metric_relabel_configs:
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Liveness;successful
              target_label: __name__
              replacement: kubernetes.liveness_probe.success.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Liveness;failed
              target_label: __name__
              replacement: kubernetes.liveness_probe.failure.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Liveness;unknown
              target_label: __name__
              replacement: kubernetes.liveness_probe.unknown.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Readiness;successful
              target_label: __name__
              replacement: kubernetes.readiness_probe.success.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Readiness;failed
              target_label: __name__
              replacement: kubernetes.readiness_probe.failure.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Readiness;unknown
              target_label: __name__
              replacement: kubernetes.readiness_probe.unknown.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Startup;successful
              target_label: __name__
              replacement: kubernetes.startup_probe.success.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Startup;failed
              target_label: __name__
              replacement: kubernetes.startup_probe.failure.total
            - source_labels: [__name__, probe_type, result]
              regex: prober_probe_total;Startup;unknown
              target_label: __name__
              replacement: kubernetes.startup_probe.unknown.total
            - source_labels: [__name__]
              regex: kubernetes\.(liveness|readiness|startup)_probe\..+
              target_label: probe_type
              replacement: ""
            - source_labels: [__name__]
              regex: kubernetes\.(liveness|readiness|startup)_probe\..+
              target_label: result
              replacement: ""

  prometheus/slis:
    config:
      scrape_configs:
        - job_name: kubelet-slis
          scrape_interval: 30s
          scheme: https
          metrics_path: /metrics/slis
          authorization:
            credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
          tls_config:
            insecure_skip_verify: true
          static_configs:
            - targets:
                - ${env:KUBE_NODE_IP}:10250
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: kubernetes_healthcheck
              target_label: __name__
              replacement: kubernetes.slis.kubernetes_healthcheck
            - source_labels: [__name__]
              regex: kubernetes_healthchecks_total
              target_label: __name__
              replacement: kubernetes.slis.kubernetes_healthchecks_total

  prometheus/self:
    config:
      scrape_configs:
        - job_name: node-collector-self
          scrape_interval: 30s
          static_configs:
            - targets:
                - 127.0.0.1:8888
              labels:
                k8s.pod.uid: ${env:POD_UID}

  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
      disk:
      filesystem:
        exclude_mount_points:
          mount_points:
            - /dev/*
            - /proc/*
            - /sys/*
            - /run/k3s/containerd/*
            - /var/lib/docker/*
            - /var/lib/kubelet/*
            - /snap/*
          match_type: regexp
        exclude_fs_types:
          fs_types:
            - autofs
            - binfmt_misc
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - hugetlbfs
            - iso9660
            - mqueue
            - nsfs
            - overlay
            - proc
            - procfs
            - pstore
            - rpc_pipefs
            - securityfs
            - selinuxfs
            - squashfs
            - sysfs
            - tracefs
          match_type: strict
      load:
      memory:
      network:
      paging:
      processes:
      system:

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    filter:
      node_from_env_var: KUBE_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.job.name
        - k8s.cronjob.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.pod.start_time
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
  transform/node-identity:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - delete_key(attributes, "k8s.cluster.name")
          - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
          - set(attributes["k8s.node.name"], "${env:KUBE_NODE_NAME}") where attributes["k8s.node.name"] == nil
  transform/self-metrics:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["k8s.cluster.name"], "${env:K8S_CLUSTER_NAME}")
          - set(attributes["service.name"], "suse-observability-agent-node-collector")
          - set(attributes["service.instance.id"], attributes["k8s.pod.uid"]) where attributes["service.instance.id"] == nil and attributes["k8s.pod.uid"] != nil
  batch: {}

exporters:
  otlphttp/suse-observability:
    auth:
      authenticator: bearertokenauth
    endpoint: ${env:PLATFORM_OTLP_ENDPOINT}
    tls:
      insecure_skip_verify: true
    compression: gzip
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  bearertokenauth:
    scheme: SUSEObservability
    token: ${env:STS_API_KEY}

service:
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check, pprof, bearertokenauth]
  pipelines:
    metrics/native:
      receivers: [kubeletstats, prometheus/cadvisor, prometheus/kubelet, prometheus/probes, prometheus/slis, hostmetrics]
      processors: [memory_limiter, k8sattributes, transform/node-identity, batch]
      exporters: [otlphttp/suse-observability]
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, k8sattributes, transform/self-metrics, batch]
      exporters: [otlphttp/suse-observability]
