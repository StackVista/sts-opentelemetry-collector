apiVersion: v1
kind: ServiceAccount
metadata:
  name: sts-node-collector-prototype
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sts-node-collector-prototype
rules:
  - apiGroups: [""]
    resources:
      - nodes/stats
      - nodes/proxy
      - nodes/metrics
      - nodes/spec
      - nodes/pods
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sts-node-collector-prototype
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sts-node-collector-prototype
subjects:
  - kind: ServiceAccount
    name: sts-node-collector-prototype
    namespace: default
